#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx12g

#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
# Off because the lightning-kmp-app composite build reaches, through its experimental/lightning-kmp
# -> bitcoin-kmp -> secp256k1-kmp submodule chain, two tasks that cannot be serialized:
# secp256k1-kmp's `:jni:generateHeaders` and `:native:buildSecp256k1<target>` both hold gradle
# script object references. The configuration cache covers a whole build tree, so an included
# build's incompatibility is this build's problem -- there is no per-build opt-out. Re-enable once
# those two tasks are fixed upstream in the secp256k1-kmp fork, or if that includeBuild goes.
org.gradle.configuration-cache=false
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false